spring.application.name=isfam-server
spring.profiles.active=local

# DB
# username / password ? application-local.properties ?? ?? ??
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ?? ??? (16kHz mono 30? wav = ? 960KB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JWT (?? ???, ?? ? ??)
isfam.jwt.secret=local-dev-only-secret-do-not-use-in-production-0123456789
isfam.jwt.access-token-ttl=30m
isfam.jwt.refresh-token-ttl=14d

# FastAPI
isfam.fastapi.base-url=http://localhost:8000

# ??? ?? ?? (?? ?????? /dev/shm/isfam)
isfam.audio.tmp-dir=${java.io.tmpdir}/isfam