# src/main/resources/application.properties
spring.application.name=isfam-server
spring.profiles.active=local

# \u2500\u2500 DB \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# username / password \uB294 application-local.properties \uC5D0\uC11C \uC8FC\uC785 (git \uC81C\uC678)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=
spring.datasource.password=

# \u2500\u2500 JPA \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# \uBAA8\uB4E0 timestamp \uB294 UTC \uB85C \uC800\uC7A5 \u2014 since/synced_at \uBE44\uAD50\uAC00 \uC11C\uBC84\u00B7DB \uC2DC\uAC04\uB300 \uC124\uC815\uC5D0 \uD754\uB4E4\uB9AC\uC9C0 \uC54A\uAC8C
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# \u2500\u2500 JSON \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# API \uBA85\uC138\uB294 \uC804\uBD80 snake_case (phone_number, error_code ...)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# \u2500\u2500 \uC5C5\uB85C\uB4DC \uC0C1\uD55C \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \uD1B5\uD654 \uC74C\uC131 \uC0C1\uD55C (16kHz mono 16bit 6\uCD08 = \uC57D 188KB). \uC11C\uBE44\uC2A4 \uC0C1\uD55C(\uC57D 192KB)\uBCF4\uB2E4 \uCEE4\uC57C \uD569\uB2C8\uB2E4 \u2014
# \uADF8 \uC0AC\uC774 \uAD6C\uAC04\uC740 \uC11C\uBE44\uC2A4\uAC00 SIZE_EXCEEDED row \uB97C \uB0A8\uAE30\uACE0, \uC774 \uAC12\uC744 \uB118\uC73C\uBA74 \uD1B0\uCEA3\uC774 row \uC5C6\uC774 \uB04A\uC2B5\uB2C8\uB2E4
spring.servlet.multipart.max-file-size=256KB
spring.servlet.multipart.max-request-size=512KB

# [P-22] \uBA40\uD2F0\uD30C\uD2B8 \uC784\uC2DC \uD30C\uC77C\uB3C4 tmpfs \uC5D0 \uB461\uB2C8\uB2E4
# \uAE30\uBCF8\uAC12\uC774\uBA74 \uD1B0\uCEA3 \uC784\uC2DC \uB514\uB809\uD130\uB9AC(\uB514\uC2A4\uD06C)\uC5D0 \uD1B5\uD654 \uC74C\uC131\uC774 \uC7A0\uC2DC\uB77C\uB3C4 \uB0A8\uACE0,
# \uADF8 \uD30C\uC77C\uC740 \uC2A4\uC704\uD37C\uAC00 \uBCF4\uC9C0 \uBABB\uD569\uB2C8\uB2E4. threshold=0 \uC774\uBA74 \uD56D\uC0C1 \uC774 \uC704\uCE58\uC5D0 \uC501\uB2C8\uB2E4.
spring.servlet.multipart.location=${isfam.audio.tmp-dir}
spring.servlet.multipart.file-size-threshold=0B

# \u2500\u2500 JWT (\uB85C\uCEEC \uC804\uC6A9, \uC6B4\uC601\uC740 \uD658\uACBD\uBCC0\uC218\uB85C \uAD50\uCCB4) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
isfam.jwt.secret=local-dev-only-secret-do-not-use-in-production-0123456789
isfam.jwt.access-token-ttl=30m
isfam.jwt.refresh-token-ttl=14d
isfam.jwt.phone-verification-token-ttl=5m

# \u2500\u2500 FastAPI \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
isfam.fastapi.base-url=http://localhost:8000

# \u2500\u2500 \uD1B5\uD654 \uC74C\uC131 \uC784\uC2DC \uC800\uC7A5 \uACBD\uB85C (\uC6B4\uC601\uC740 tmpfs /dev/shm/isfam) \u2500\u2500
isfam.audio.tmp-dir=${java.io.tmpdir}/isfam

# [P-22] tmpfs \uACE0\uC544 \uD30C\uC77C \uC2A4\uC704\uD37C
# orphan-age \uB294 read-timeout \uBCF4\uB2E4 \uCD5C\uC18C 1\uBD84 \uAE38\uC5B4\uC57C \uD568. \uC9E7\uC73C\uBA74 \uAE30\uB3D9 \uAC70\uBD80.
# (\uBD84\uC11D \uC911\uC778 \uD30C\uC77C\uC744 AudioTempSweeper \uAC00 \uC9C0\uC6B0\uC9C0 \uC54A\uB3C4\uB85D)
isfam.audio.orphan-age=PT5M
isfam.audio.sweep-interval=PT10M
isfam.audio.sweep-initial-delay=PT2M

# \u2500\u2500 API \uBB38\uC11C \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
springdoc.swagger-ui.path=/swagger-ui.html

# \u2500\u2500 \uC628\uB514\uBC14\uC774\uC2A4 \uBAA8\uB378 \uC815\uBCF4 (GET /model-info) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \uD654\uC790 \uBAA8\uB378(ECAPA)\uB9CC \uD574\uB2F9. \uB525\uBCF4\uC774\uC2A4 \uBAA8\uB378\uC740 \uC11C\uBC84 \uCABD\uC774\uB77C \uC5EC\uAE30\uC5D0 \uC5C6\uC74C
isfam.model.latest-version=ecapa-tdnn-v1
isfam.model.min-supported-version=ecapa-tdnn-v1
# \uD638\uD658\uC774 \uAE68\uC9C0\uB294 \uBAA8\uB378 \uBC30\uD3EC \uC2DC\uC5D0\uB9CC true. \uC571\uC774 \uAC15\uC81C \uC5C5\uB370\uC774\uD2B8\uB97C \uC548\uB0B4\uD568
isfam.model.update-required=false
# APK \uB0B4\uC7A5 \uBAA8\uB378\uC774\uB77C \uBE44\uC6CC \uB460. \uBAA8\uB378 \uB2E4\uC6B4\uB85C\uB4DC\uB97C \uBD99\uC774\uBA74 \uADF8\uB54C URL \uAE30\uC785
isfam.model.download-url=

# \u2500\u2500 \uCD08\uB300 (Phase 4) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \uBA85\uC138 [\uC815\uCC45] \uCF54\uB4DC 72\uC2DC\uAC04
isfam.invite.code-ttl-hours=72
# %s \uC790\uB9AC\uC5D0 invite_code \uAC00 \uB4E4\uC5B4\uAC10. \uB3C4\uBA54\uC778/\uB525\uB9C1\uD06C \uD655\uC815 \uC2DC \uAD50\uCCB4
isfam.invite.link-format=https://isfam.app/i/%s
isfam.invite.qr-url-format=https://isfam.app/qr/%s.png

# \u2500\u2500 \uD478\uC2DC / FCM (Phase 5) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# false \uBA74 NoOpPushSender \uAC00 \uB5A0\uC11C \uD478\uC2DC\uB97C \uBCF4\uB0B4\uC9C0 \uC54A\uACE0 \uAC74\uB108\uB701\uB2C8\uB2E4.
# Firebase \uD504\uB85C\uC81D\uD2B8 \uC124\uC815\uC774 \uB05D\uB09C \uB4A4 true \uB85C \uBC14\uAFB8\uC138\uC694.
isfam.push.enabled=false
# \uC11C\uBE44\uC2A4 \uACC4\uC815 \uD0A4(JSON) \uACBD\uB85C. \uBE44\uC6B0\uBA74 GOOGLE_APPLICATION_CREDENTIALS \uD658\uACBD\uBCC0\uC218\uB97C \uC0AC\uC6A9.
# \uD0A4 \uD30C\uC77C\uC740 \uC808\uB300 git \uC5D0 \uC62C\uB9AC\uC9C0 \uB9C8\uC138\uC694.
isfam.push.credentials-path=

# Phase 6\u00B77 \uC784\uBCA0\uB529 \uC554\uD638\uD654 \uD0A4
isfam.crypto.embedding-key=${ISFAM_CRYPTO_EMBEDDING_KEY:}

# Phase 8 \u2014 FastAPI \uB525\uBCF4\uC774\uC2A4 \uD310\uC815 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
isfam.fastapi.detect-path=/api/v1/anti-spoofing/detect
isfam.fastapi.connect-timeout=3s
isfam.fastapi.read-timeout=20s

# \u2500\u2500 [P-24] \uB85C\uADF8 PII \uCC28\uB2E8 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \uC544\uB798 \uC904\uC740 "\uCF1C\uB294 \uC21C\uAC04 \uAC1C\uC778\uC815\uBCF4\uAC00 \uB85C\uADF8\uC5D0 \uB0A8\uB294" \uC124\uC815\uB4E4\uC785\uB2C8\uB2E4.
# \uC6B4\uC601\uC5D0\uC11C\uB294 DEBUG/TRACE \uB85C \uC62C\uB9AC\uC9C0 \uB9C8\uC138\uC694.

# \uBA40\uD2F0\uD30C\uD2B8 \uC0C1\uC138 \u2014 \uCF1C\uBA74 \uD1B5\uD654 \uC74C\uC131 \uC694\uCCAD \uB0B4\uC6A9\uC774 \uB85C\uADF8\uB85C \uAC10
logging.level.org.springframework.web.multipart=WARN
logging.level.org.apache.tomcat.util.http.fileupload=WARN

# SQL \uBC14\uC778\uB529 \u2014 \uCF1C\uBA74 \uC784\uBCA0\uB529\u00B7\uC804\uD654\uBC88\uD638\uAC00 \uD30C\uB77C\uBBF8\uD130\uB85C \uB85C\uADF8\uC5D0 \uCC0D\uD798
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# \uBCF4\uC548 \uD544\uD130 \uC0C1\uC138\uB294 \uD544\uC694\uD560 \uB54C\uB9CC
logging.level.org.springframework.security=INFO

# \u2500\u2500 [P-21] \uC6B4\uC601 \uC54C\uB78C (\uC218\uC2E0\uCC98\uB294 Phase 15) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \uC6F9\uD6C5 \uC8FC\uC18C\uAC00 \uBE44\uC5B4 \uC788\uC73C\uBA74 WARN \uD55C \uBC88 \uB0A8\uAE30\uACE0 \uBC1C\uC1A1\uD558\uC9C0 \uC54A\uC74C
isfam.alert.slack-webhook-url=${ISFAM_ALERT_SLACK_WEBHOOK_URL:}
isfam.alert.repeat-interval=PT1H
isfam.alert.timeout=PT3S

# health \uB294 \uD30C\uAE30 \uB204\uB77D\uC774 \uC788\uC73C\uBA74 503 \uC744 \uBC18\uD658\uD558\uBBC0\uB85C, \uB85C\uB4DC\uBC38\uB7F0\uC11C \uD5EC\uC2A4\uCCB4\uD06C\uC5D0 \uC4F0\uBA74 \uC548 \uB428
# \uB85C\uB4DC\uBC38\uB7F0\uC11C \uD5EC\uC2A4\uCCB4\uD06C\uB294 \uAE30\uC874 /health, \uC774 \uACBD\uB85C\uB294 \uBAA8\uB2C8\uD130\uB9C1\u00B7\uC54C\uB78C \uC6A9\uB3C4
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# \u2500\u2500 \uB85C\uADF8 \uD328\uD134 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \uB85C\uADF8 \uD55C \uC904\uB9C8\uB2E4 traceId\u00B7userId \uB97C \uBD99\uC784 \u2014 \uC811\uC18D\uAE30\uB85D \uD14C\uC774\uBE14(Phase 12)\uC758 \uAC19\uC740 \uC694\uCCAD\uACFC \uC774\uC5B4 \uBD99\uC774\uAE30 \uC704\uD568
# \uAC12\uC774 \uC5C6\uC73C\uBA74 \uBE44\uC6CC \uB460. \uD5C8\uC6A9 \uD0A4(traceId\u00B7userId\u00B7deviceId)\uB294 MdcContext \uAC00 \uAD00\uB9AC
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{userId:-}]

# \u2500\u2500 [P-03] \uBCF4\uAD00 \uAE30\uAC04 \u00B7 \uD30C\uAE30 \uBC30\uCE58 (Phase 13) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \uAC12\uC758 \uCD9C\uCC98\uB294 legal-compliance.md 4\uC7A5 "\uBCF4\uAD00 \uBC0F \uD30C\uAE30". \uBB38\uC11C\uB97C \uBA3C\uC800 \uACE0\uCE5C \uB4A4 \uC5EC\uAE30\uB97C \uB9DE\uCD9C \uAC83.
# \uC811\uC18D\uAE30\uB85D 3\uC885(spoof-checks \u00B7 embedding-access-logs \u00B7 voiceprint-access-logs)\uC740
# 730\uC77C \uBBF8\uB9CC\uC774\uBA74 \uAE30\uB3D9 \uAC70\uBD80 (\uACE0\uC2DC \uC81C8\uC870, \uC6D0\uCE59 R-7)
isfam.retention.cron=0 10 4 * * *
isfam.retention.zone=Asia/Seoul
isfam.retention.chunk-size=1000
isfam.retention.max-chunks-per-run=100
isfam.retention.days.phone-verifications=30
isfam.retention.days.refresh-tokens=90
isfam.retention.days.notifications=90
isfam.retention.days.call-events=365
isfam.retention.days.voice-analyses=365
isfam.retention.days.spoof-checks=730
isfam.retention.days.embedding-access-logs=730
isfam.retention.days.voiceprint-access-logs=730
isfam.retention.days.danger-shares=7